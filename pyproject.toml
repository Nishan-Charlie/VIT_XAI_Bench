[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "xai-bench"
version = "0.2.0"
description = "A controlled benchmark of attribution methods on Vision Transformers and CNNs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sathiyamohan Nishankar" },
    { name = "Nethmi Pathirana" },
    { name = "Pubudu Sanjeewani" },
    { name = "Asanka Perera" },
    { name = "Selvarajah Thuseethan" },
]
keywords = ["explainable-ai", "xai", "vision-transformer", "attribution", "benchmark"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core runtime. `quantus` is a hard dependency, not an extra: every module in
# xai_bench.metrics imports it at module level.
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=1.0.0",
    "quantus>=0.5",
    "captum>=0.7.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "scikit-image>=0.21",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
# Relevance-propagation methods (AttnLRP, CP-LRP). Kept optional because they
# monkey-patch timm at class level and are only needed for LRP configs.
lrp = ["lxt>=0.6", "zennit>=0.5"]
# Perturbation methods with heavier dependencies.
perturbation = ["grad-cam>=1.5", "lime>=0.2"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
]
all = ["xai-bench[lrp,perturbation,dev]"]

[project.urls]
Repository = "https://github.com/Nishan-Charlie/VIT_XAI_Bench"

[project.scripts]
xai-bench = "xai_bench.runner:main"

[tool.setuptools.packages.find]
include = ["xai_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that download weights or need a GPU (deselect with '-m \"not slow\"')",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["website", "notebooks", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",   # long lines: scientific docstrings and formulas
    "B008",   # function call in default arg: common in registry factories
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"scripts/smoke_test.py" = ["E402"]
"scripts/build_results.py" = ["E402"]
"scripts/validate_results.py" = ["E402"]
"scripts/export_web_data.py" = ["E402"]
"scripts/generate_figures.py" = ["E402"]
# Legacy single-purpose research scripts, kept for provenance. Linted for real
# errors but not restyled: rewriting them risks changing the behaviour that
# produced the archived results.
"scripts/bench/*" = ["E402", "E701", "E702", "E722", "C408", "B007", "F841", "E741", "C416"]
"scripts/*.py" = ["E402", "E701", "E702", "E722", "C408", "B007", "F841", "E741", "C416"]
