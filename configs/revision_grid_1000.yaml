# NEUCOM revision: the five-metric grid (Tables PG, FC, FE, MS, SP) on all
# 1,000 evaluation images, for all eight backbones and every method. Extends
# revision_grid_500.yaml: every (model, method, image) evaluation is seeded from
# xai_bench.runner.evaluation_seed, so the rows of the first 500 images are those
# of that run, and prefill_1000.py seeds the shards with them.
#
# QUEUE_N=1000 scripts/revision_neucom/queue_500.py splits this sweep into one run
# per (backbone, method group); AttnLRP (ViT-B/16 only) runs in its own process:
# revision_grid_1000_attnlrp.yaml.

models:
  - "resnet50"
  - "vit_base_patch16_224"
  - "swin_base_patch4_window7_224"
  - "pvt_v2_b2"
  - "maxvit_small_tf_224"
  - "mobilevitv2_100"
  - "efficientvit_b1"
  - "efficientvit_b2"

methods:
  - "saliency"
  - "integrated_gradients"
  - "smoothgrad"
  - "input_x_gradient"
  - "vargrad"
  - "gradient_shap"
  - "grad_cam"
  - "grad_cam_plus_plus"
  - "attention_rollout" # ViT-B/16 only (limit_methods_to_supported)
  - "lime"
  - "occlusion"
  - "rise"

metrics:
  - "faithfulness_correlation"
  - "faithfulness_estimate"
  - "pointing_game"
  - "max_sensitivity"
  - "sparseness"

metric_kwargs:
  faithfulness_correlation:
    { nr_runs: 20, subset_size: 224, return_aggregate: false }
  faithfulness_estimate: { features_in_step: 448, return_aggregate: false }
  max_sensitivity: { nr_samples: 3, lower_bound: 0.2 }

dataset: "imagenets_cached"
dataset_kwargs:
  { cache_path: "data/ImageNetS/cache_validation_1000_v2.pt", num_samples: 1000 }
num_images: 1000
seeds: [0]
device: "auto"
input_size: 224
output_dir: "results"
run_name: "revision_grid_1000"
save_saliency: false
limit_methods_to_supported: true
