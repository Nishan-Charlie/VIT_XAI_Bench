# NEUCOM revision: AttnLRP (ViT-B/16 only) in the five-metric grid on the first
# 500 images; companion of revision_grid_500.yaml. AttnLRP patches classes at
# set-up, so it runs in its own process.

models:
  - "vit_base_patch16_224"
methods:
  - "attnlrp"
metrics:
  - "faithfulness_correlation"
  - "faithfulness_estimate"
  - "pointing_game"
  - "max_sensitivity"
  - "sparseness"
metric_kwargs:
  faithfulness_correlation:
    { nr_runs: 20, subset_size: 224, return_aggregate: false }
  faithfulness_estimate: { features_in_step: 448, return_aggregate: false }
  max_sensitivity: { nr_samples: 3, lower_bound: 0.2 }
dataset: "imagenets_cached"
dataset_kwargs:
  { cache_path: "data/ImageNetS/cache_validation_1000_v2.pt", num_samples: 500 }
num_images: 500
seeds: [0]
device: "auto"
input_size: 224
output_dir: "results"
run_name: "revision_grid_500_attnlrp"
save_saliency: false
limit_methods_to_supported: true
